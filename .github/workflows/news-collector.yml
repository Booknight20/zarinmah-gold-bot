name: ZarinMah News Collector

on:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "Asia/Tehran"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zarinmah-news-collector
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect news
        run: |
          python news_bot.py

      - name: Filter market news
        run: |
          python news_filter.py

      - name: Rank news
        run: |
          python news_ranker.py

      - name: Deduplicate stories
        run: |
          python news_deduper.py

      - name: Format news
        run: |
          python news_formatter.py

      - name: Collect analyst posts
        run: |
          python analyst_bot.py

      - name: Publish important news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python news_publisher.py

      - name: Publish analyst summaries
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python analyst_publisher.py

      - name: Save news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news_items.json
          git add news_filtered.json
          git add news_ranked.json
          git add news_unique.json
          git add news_ready.json
          git add news_published.json
          git add analyst_ready.json
          git add analyst_seen.json
          git add analyst_published.json

          if git diff --cached --quiet; then
            echo "No news data changes."
            exit 0
          fi

          git commit -m "Update news and analyst data"

          git pull --rebase origin main

          git push origin main
