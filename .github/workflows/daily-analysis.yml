name: ZarinMah Daily Market Analysis Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCHEDULED_RUN: "true"
        run: |
          python daily_analysis.py

      - name: Save daily send status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add send_status.json

          if git diff --cached --quiet; then
            echo "No daily status changes."
          else
            git commit -m "Update daily analysis status"
            git push
          fi
