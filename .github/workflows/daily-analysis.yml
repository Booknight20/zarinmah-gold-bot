name: ZarinMah Daily Analysis

on:
  workflow_dispatch:

  schedule:
    - cron: "45 11 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 jdatetime

      - name: Send daily analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EITAAYAR_TOKEN: ${{ secrets.EITAAYAR_TOKEN }}
          EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u daily_send.py
