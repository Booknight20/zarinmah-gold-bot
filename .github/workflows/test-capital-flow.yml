name: Test Capital Flow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کدهای مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب کتابخانه موردنیاز
        run: python -m pip install requests

      - name: اجرای آزمایش جریان پول
        run: python test_capital_flow.py
