name: ZarinMah Analyst Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyst-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch for safe testing
        uses: actions/checkout@v4
        with:
          ref: feature/analyst-filter-preview-2026-11-19

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and filter analyst posts (no publishing)
        run: python -u analyst_bot.py

      - name: Show candidate and rejection diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ready_path = Path("analyst_ready.json")
          if ready_path.exists():
              items = json.loads(ready_path.read_text(encoding="utf-8"))
              print("Candidate count:", len(items))
          else:
              print("analyst_ready.json was not generated")
          diagnostics_path = Path("analyst_rejected_diagnostics.json")
          if diagnostics_path.exists():
              report = json.loads(diagnostics_path.read_text(encoding="utf-8"))
              print("Diagnostic totals:", json.dumps(report.get("summary", {}), ensure_ascii=False))
              for source, stats in report.get("sources", {}).items():
                  print("SOURCE:", source, json.dumps(stats, ensure_ascii=False))
              for item in report.get("rejected_items", []):
                  print("REJECTED:", item.get("analyst"), "|", item.get("reject_reason"), "| score:", item.get("score"), "|", item.get("title"))
          else:
              print("analyst_rejected_diagnostics.json was not generated")
          PY

      - name: Upload dry-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyst-dry-run-results
          path: |
            analyst_ready.json
            analyst_rejected_diagnostics.json
          if-no-files-found: warn
          retention-days: 7
