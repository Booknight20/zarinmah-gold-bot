name: ZarinMah Preview Analysis Archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zarinmah-preview-analysis-archive
  cancel-in-progress: false

jobs:
  collect-and-archive:
    if: github.ref == 'refs/heads/feature/public-analysis-feed-preview-2026-11-21'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/public-analysis-feed-preview-2026-11-21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect analyst posts
        run: python analyst_bot.py

      - name: Build permanent website archive
        run: python analyst_public_feed.py

      - name: Save preview archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyst_public.json analyst_ready.json analyst_seen.json
          if git diff --cached --quiet; then
            echo "No preview analysis changes."
            exit 0
          fi
          git commit -m "Update preview public analyst archive"
          git push origin HEAD:feature/public-analysis-feed-preview-2026-11-21
