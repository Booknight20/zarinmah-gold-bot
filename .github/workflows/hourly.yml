name: ZarinMah Scheduled Bot

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Tehran"

    - cron: "45 11 * * *"
      timezone: "Asia/Tehran"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  hourly-price:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '17 * * * *'

    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check price publishing window
        run: |
          CURRENT_HOUR=$(TZ=Asia/Tehran date +%H)

          echo "Tehran hour: $CURRENT_HOUR"

          if [ "$CURRENT_HOUR" -lt 9 ] || [ "$CURRENT_HOUR" -ge 22 ]; then
            echo "Price publishing is disabled between 22:00 and 08:59 Tehran time."
            exit 0
          fi

          echo "Price publishing window is active."

      - name: Run hourly price bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCHEDULED_RUN: "true"
        run: |
          CURRENT_HOUR=$(TZ=Asia/Tehran date +%H)

          if [ "$CURRENT_HOUR" -lt 9 ] || [ "$CURRENT_HOUR" -ge 22 ]; then
            echo "Skipping price bot."
            exit 0
          fi

          python bot.py

      - name: Save send status and previous prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous_prices.json send_status.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update price bot status"
            git pull --rebase origin main
            git push origin main
          fi

  daily-analysis:
    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '45 11 * * *'

    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCHEDULED_RUN: "true"
        run: |
          python daily_analysis.py

      - name: Save daily send status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f send_status.json ]; then
            git add send_status.json
          else
            echo "No send_status.json file to save."
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update daily analysis status"
            git pull --rebase origin main
            git push origin main
          fi
