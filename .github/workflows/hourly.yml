name: ZarinMah Hourly Price Bot

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  hourly-price:
    name: Hourly Price Bot

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 jdatetime


      - name: Run hourly bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EITAAYAR_TOKEN: ${{ secrets.EITAAYAR_TOKEN }}
          EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
          SCHEDULED_RUN: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u bot.py


      - name: Save hourly files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous_prices.json send_status.json || true

          if git diff --cached --quiet; then
            echo "No hourly files changed."
          else
            git commit -m "Update hourly prices"
            git push
          fi
