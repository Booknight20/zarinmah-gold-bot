name: ZarinMah Hourly Gold Price

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Tehran"

    - cron: "45 11 * * *"
      timezone: "Asia/Tehran"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  run-price-bot:

    # اجرای قیمت ساعتی فقط برای زمان 17 دقیقه هر ساعت
    # و اجرای دستی
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '45 11 * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run price bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python bot.py

      - name: Save previous prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous_prices.json

          if git diff --cached --quiet; then
            echo "No changes to previous prices."
          else
            git commit -m "Update previous prices"
            git push
          fi


  run-daily-analysis:

    # فقط هر روز ساعت 11:45 اجرا شود
    if: github.event_name == 'schedule' && github.event.schedule == '45 11 * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python daily_analysis.py
