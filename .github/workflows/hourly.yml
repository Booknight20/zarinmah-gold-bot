name: ZarinMah Scheduled Bot

on:
  schedule:
    # انتشار قیمت هر ساعت در دقیقه 17
    - cron: "17 * * * *"
      timezone: "Asia/Tehran"

    # تحلیل روزانه ساعت 11:45 تهران
    - cron: "45 11 * * *"
      timezone: "Asia/Tehran"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =====================================================
  # ربات قیمت ساعتی
  # =====================================================

  hourly-price:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '17 * * * *'

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # دریافت Repository
      # -------------------------------------------------

      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # Python
      # -------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------------------------------
      # Dependencies
      # -------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # بررسی ساعت انتشار
      #
      # 09:00 تا 21:59 = فعال
      # 22:00 تا 08:59 = خاموش
      # -------------------------------------------------

      - name: Check price publishing window
        run: |
          CURRENT_HOUR=$(TZ=Asia/Tehran date +%H)

          echo "================================="
          echo "Tehran hour: $CURRENT_HOUR"
          echo "================================="

          if [ "$CURRENT_HOUR" -lt 9 ] || [ "$CURRENT_HOUR" -ge 22 ]; then
            echo "Price publishing is disabled between 22:00 and 08:59 Tehran time."
            exit 0
          fi

          echo "Price publishing window is active."

      # -------------------------------------------------
      # اجرای ربات قیمت
      # -------------------------------------------------

      - name: Run hourly price bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCHEDULED_RUN: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          CURRENT_HOUR=$(TZ=Asia/Tehran date +%H)

          echo "================================="
          echo "Starting ZarinMah price bot"
          echo "Tehran hour: $CURRENT_HOUR"
          echo "================================="

          if [ "$CURRENT_HOUR" -lt 9 ] || [ "$CURRENT_HOUR" -ge 22 ]; then
            echo "Price publishing is disabled."
            exit 0
          fi

          set +e

          python -u bot.py 2>&1 | tee bot_output.log

          BOT_EXIT_CODE=${PIPESTATUS[0]}

          echo "================================="
          echo "bot.py exit code: $BOT_EXIT_CODE"
          echo "================================="

          exit $BOT_EXIT_CODE

      # -------------------------------------------------
      # نمایش لاگ ربات برای اطمینان
      # -------------------------------------------------

      - name: Show price bot log
        if: always()
        run: |
          echo "================================="
          echo "PRICE BOT LOG"
          echo "================================="

          if [ -f bot_output.log ]; then
            cat bot_output.log
          else
            echo "bot_output.log was not created."
          fi

      # -------------------------------------------------
      # ذخیره وضعیت و قیمت‌های قبلی
      # -------------------------------------------------

      - name: Save send status and previous prices
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous_prices.json
          git add send_status.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update price bot status"

            git pull --rebase origin main

            git push origin main
          fi


  # =====================================================
  # تحلیل روزانه
  # =====================================================

  daily-analysis:
    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '45 11 * * *'

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # دریافت Repository
      # -------------------------------------------------

      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # Python
      # -------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------------------------------
      # Dependencies
      # -------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # اجرای تحلیل روزانه
      # -------------------------------------------------

      - name: Run daily analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCHEDULED_RUN: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          echo "================================="
          echo "Starting daily market analysis"
          echo "================================="

          python -u daily_analysis.py

      # -------------------------------------------------
      # ذخیره وضعیت تحلیل روزانه
      # -------------------------------------------------

      - name: Save daily send status
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f send_status.json ]; then
            git add send_status.json
          else
            echo "No send_status.json file to save."
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update daily analysis status"

            git pull --rebase origin main

            git push origin main
          fi
