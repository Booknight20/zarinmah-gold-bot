name: ZarinMah Gold Bot

on:
  schedule:

    # پست ساعتی
    - cron: "5 * * * *"
      timezone: "Asia/Tehran"

    # گزارش روزانه ساعت 11 تهران
    - cron: "0 11 * * *"
      timezone: "Asia/Tehran"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  hourly:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '5 * * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run hourly bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_MODE: hourly
        run: |
          python bot.py

      - name: Save market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous_prices.json market_history.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update market history"
            git push
          fi


  daily:
    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '0 11 * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_MODE: daily
        run: |
          python bot.py

      - name: Save market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous_prices.json market_history.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update market history"
            git push
          fi
